apiVersion: apps/v1
kind: Deployment

metadata:
  name: python-app-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-app

  template:
    metadata:
      labels:
        app: python-app

    spec:
      containers:
        - name: python-app
          image: python-k8s-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000